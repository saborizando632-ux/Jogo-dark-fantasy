name: Gerar Licença Unity

on:
  workflow_dispatch:

jobs:
  activation:
    name: Solicitar arquivo de ativação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar arquivo ALF via Unity Builder
        id: activation
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          unityVersion: 2022.3.21f1
          allowDirtyBuild: true
        continue-on-error: true

      - name: Procurar arquivos ALF gerados
        run: |
          find . -name "*.alf" -print || true

      - name: Disponibilizar arquivo ALF
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: '**/*.alf'
          if-no-files-found: error
