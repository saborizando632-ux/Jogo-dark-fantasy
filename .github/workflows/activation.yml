name: Gerar Licença Unity

on:
  workflow_dispatch:

jobs:
  activation:
    name: Solicitar arquivo de ativação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar arquivo ALF via Unity Builder
        id: activation
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 2022.3.10f1 # Substitua pela versão exata do seu projeto (ou remova esta linha para detecção automática)
          allowDirtyBuild: true
        continue-on-error: true

      - name: Disponibilizar arquivo ALF
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: '*.alf'
          if-no-files-found: error
